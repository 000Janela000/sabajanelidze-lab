name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter @lab/core run typecheck
      - name: unit and property tests
        run: pnpm --filter @lab/core run test
      - name: shared race figure (typecheck, tests, and the committed recording and build are up to date)
        run: |
          pnpm --filter @lab/race-figure run typecheck
          pnpm --filter @lab/race-figure run test
          pnpm --filter @lab/race-figure run check
          git diff --exit-code -- packages/race-figure
      - name: lint and format
        run: pnpm exec biome ci .

  site:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The proof cards' build chain reads the full git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck (astro check)
        run: pnpm --filter @lab/site run typecheck
      - name: build (fails if a code excerpt marker or a linked file is missing)
        run: pnpm --filter @lab/site run build
      - name: install the test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: browser tests (desktop, phone, reduced motion, accessibility, no-JavaScript text)
        run: pnpm exec playwright test

  postgres:
    name: real database races (withdrawals, identity-check messages at once)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: lab-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that exists only inside this CI run.
      DATABASE_URL: postgres://postgres:lab-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: concurrency tests on a real Postgres server
        run: pnpm --filter @lab/core exec vitest run test/payments/postgres.test.ts test/kyc/postgres.test.ts

  go:
    name: Go version (race detector + real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: lab-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that exists only inside this CI run.
      DATABASE_URL: postgres://postgres:lab-test-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests with the race detector (20 withdrawals at once, in memory and on Postgres)
        run: go test -race -count=1 -timeout 2m -v ./...
